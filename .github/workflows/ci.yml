name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    # Поднимаем базу данных с pgvector для тестов
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news
          POSTGRES_DB: pet_news_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check src/ tests/ scripts/
        ruff format --check src/ tests/ scripts/

    - name: Type check with mypy
      run: |
        mypy src/news_scraper

    - name: Run tests
      env:
        # Переопределяем URL базы для CI, чтобы тесты не трогали прод
        DATABASE_URL: postgresql+asyncpg://news:news@localhost:5432/pet_news_test
        REDIS_URL: redis://localhost:6379/0
        OLLAMA_BASE_URL: http://localhost:11434
        LANGFUSE_PUBLIC_KEY: pk-lf-dummy
        LANGFUSE_SECRET_KEY: sk-lf-dummy
        LANGFUSE_HOST: http://localhost:3000
      run: |
        # Применяем миграции к тестовой БД
        alembic upgrade head
        # Запускаем тесты
        pytest tests/ -v
