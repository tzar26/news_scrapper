services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: news_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: pet_news
    ports:
      - '5436:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U news -d pet_news']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
